<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>LOGIN</h1>

    <form action="login.php" method="POST">

        <label>Username</label>

        <input
        type="text"
        name="username"
        placeholder="Enter Username"
        required>

        <label>Password</label>

        <input
        type="password"
        name="password"
        placeholder="Enter Password"
        required>

        <label>Role</label>

        <select name="role" required>

            <option value="">
                Select Role
            </option>

            <option value="student">
                Student
            </option>

            <option value="admin">
                Admin
            </option>

        </select>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="link">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>

</body>

</html>
